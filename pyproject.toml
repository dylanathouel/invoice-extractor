[project]
name = "invoice-extractor"
version = "0.1.0"
description = "LLM-based extraction of structured data from Israeli invoices and receipts"
readme = "README.md"
authors = [
    { name = "Dylan", email = "dathouel@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
invoice-extractor = "invoice_extractor:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
